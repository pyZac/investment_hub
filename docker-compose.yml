services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: investment_hub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/investment_hub?schema=public
      TIMEZONE: Asia/Dubai
      MIN_WITHDRAWAL: "50"
      DEFAULT_DAILY_INTEREST_RATE_BP: "0"
      DEFAULT_DIRECT_COMMISSION_RATE_BP: "0"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      target: dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/investment_hub?schema=public
      TIMEZONE: Asia/Dubai
      MIN_WITHDRAWAL: "50"
      DEFAULT_DAILY_INTEREST_RATE_BP: "0"
      DEFAULT_DIRECT_COMMISSION_RATE_BP: "0"
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  postgres_data:
